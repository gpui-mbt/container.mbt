name: MoonBit native CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: native compile and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - name: Install dependencies
        run: moon update
      - name: Check MoonBit native API
        run: moon check --target native --deny-warn
      - name: Run unit and conformance tests
        run: moon test --target native
      - name: Build native library
        run: moon build --target native
      - name: Check Mooncakes package
        run: moon package --list

  docker-e2e:
    name: Linux Docker daemon E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - name: Install dependencies
        run: moon update
      - name: Prepare Docker daemon
        run: |
          docker info
          docker pull alpine:3.20
      - name: Linux Docker lifecycle integration
        run: moon run smoke --target native
      - name: Linux direct-API E2E (no docker CLI on PATH)
        run: |
          set -e
          docker run -d --name container-mbt-e2e-foreign alpine:3.20 tail -f /dev/null
          docker ps -a | tee /tmp/ps-before.txt
          moon build --target native
          BIN="$(pwd)/_build/native/debug/build/smoke_linux/smoke_linux.exe"
          CRASHBIN="$(pwd)/_build/native/debug/build/smoke_crash/smoke_crash.exe"
          # Crash injection (0021): a child process starts an owned
          # container and is SIGKILLed; smoke_linux's recovery step must
          # collect it on the next run.
          env -i PATH=/container-mbt-empty HOME="$HOME" "$CRASHBIN" &
          CRASH_PID=$!
          sleep 5
          kill -9 $CRASH_PID
          wait $CRASH_PID || true
          # Run the direct-API binary with a PATH that cannot resolve the
          # docker CLI: only the unix socket path is exercised.
          env -i PATH=/container-mbt-empty HOME="$HOME" "$BIN" 2>&1 | tee /tmp/e2e-run.log
          docker ps -a | tee /tmp/ps-after.txt
          if docker ps -a --format '{{.Names}}' | grep '^container-mbt' | grep -v '^container-mbt-e2e-foreign$'; then
            echo "leftover container-mbt container found" >&2
            exit 1
          fi
          docker inspect container-mbt-e2e-foreign >/dev/null
          docker rm -f container-mbt-e2e-foreign
      - name: Upload Docker E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/e2e-run.log
            /tmp/ps-before.txt
            /tmp/ps-after.txt
          if-no-files-found: ignore
