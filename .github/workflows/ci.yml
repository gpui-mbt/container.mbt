name: MoonBit native CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - name: Install dependencies
        run: moon update
      - name: Check MoonBit native API
        run: moon check --target native --deny-warn
      - name: Run unit and conformance tests
        run: moon test --target native
      - name: Build native library
        run: moon build --target native
      - name: Linux Docker lifecycle integration
        run: |
          docker info
          docker pull alpine:3.20
          moon run smoke --target native
      - name: Check Mooncakes package
        run: moon package --list
